<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Undead Skeleton Warrior (Standing full character sprite) -->
  <!-- Shadow -->
  <ellipse cx="32" cy="56" rx="16" ry="5" fill="#0a0c10" opacity="0.6"/>

  <!-- Tattered Dark Shroud / Cape (behind skeleton) -->
  <path d="M22 28 L17 50 L47 50 L42 28 Z" fill="#3b0764"/>
  <polygon points="17,50 20,47 24,50 29,47 34,50 39,47 43,50 47,50" fill="#0a0c10"/>

  <!-- Rusty Tattered Loincloth & Belt -->
  <polygon points="25,40 39,40 36,49 28,49" fill="#991b1b"/>
  <rect x="24" y="39" width="16" height="3" fill="#450a0a"/>
  <circle cx="32" cy="40.5" r="1.5" fill="#d97706"/>

  <!-- Ribcage & Spine -->
  <line x1="32" y1="24" x2="32" y2="41" stroke="#f1f5f9" stroke-width="3"/>
  <!-- Ribs -->
  <path d="M25 28 Q32 30 39 28" stroke="#cbd5e1" stroke-width="2.2" fill="none"/>
  <path d="M24 32 Q32 34 40 32" stroke="#cbd5e1" stroke-width="2.2" fill="none"/>
  <path d="M26 36 Q32 38 38 36" stroke="#cbd5e1" stroke-width="2.2" fill="none"/>

  <!-- Pelvis -->
  <ellipse cx="32" cy="41" rx="6" ry="2.5" fill="#e2e8f0"/>

  <!-- Bone Legs & Rusty Greaves -->
  <line x1="28" y1="42" x2="27" y2="52" stroke="#f1f5f9" stroke-width="2.5"/>
  <line x1="36" y1="42" x2="37" y2="52" stroke="#f1f5f9" stroke-width="2.5"/>
  <rect x="25" y="47" width="4" height="6" rx="1" fill="#475569"/>
  <rect x="35" y="47" width="4" height="6" rx="1" fill="#475569"/>
  <ellipse cx="26.5" cy="54.5" rx="3" ry="1.5" fill="#cbd5e1"/>
  <ellipse cx="37.5" cy="54.5" rx="3" ry="1.5" fill="#cbd5e1"/>

  <!-- Skull Head & Iron Helmet -->
  <rect x="26" y="11" width="12" height="12" rx="4" fill="#f8fafc"/>
  <rect x="28" y="20" width="8" height="5" rx="1" fill="#f1f5f9"/>
  <!-- Eye sockets (Glowing evil red/orange soul-fire) -->
  <circle cx="29.5" cy="17" r="2.2" fill="#09090b"/>
  <circle cx="29.5" cy="17" r="1.2" fill="#ef4444"/>
  <circle cx="29.5" cy="17" r="0.5" fill="#fef08a"/>
  <circle cx="34.5" cy="17" r="2.2" fill="#09090b"/>
  <circle cx="34.5" cy="17" r="1.2" fill="#ef4444"/>
  <circle cx="34.5" cy="17" r="0.5" fill="#fef08a"/>
  <!-- Nose cavity & teeth -->
  <polygon points="32,19 31,21 33,21" fill="#09090b"/>
  <line x1="29" y1="23" x2="35" y2="23" stroke="#475569" stroke-width="1"/>
  <line x1="30" y1="22" x2="30" y2="24" stroke="#475569" stroke-width="0.8"/>
  <line x1="32" y1="22" x2="32" y2="24" stroke="#475569" stroke-width="0.8"/>
  <line x1="34" y1="22" x2="34" y2="24" stroke="#475569" stroke-width="0.8"/>

  <!-- Cracked Bronze Nasal Helmet -->
  <path d="M25 13 C25 5, 39 5, 39 13 Z" fill="#b45309"/>
  <rect x="24" y="11" width="16" height="3" rx="1" fill="#d97706"/>
  <rect x="31" y="13" width="2" height="5" fill="#d97706"/>
  <line x1="30" y1="7" x2="33" y2="11" stroke="#451a03" stroke-width="1"/>

  <!-- Left Hand: Cracked Wooden Buckler with Iron Rim -->
  <g transform="translate(10, 24)">
    <line x1="12" y1="2" x2="6" y2="8" stroke="#f1f5f9" stroke-width="2"/>
    <circle cx="6" cy="10" r="9" fill="#78350f"/>
    <circle cx="6" cy="10" r="9" stroke="#64748b" stroke-width="1.8" fill="none"/>
    <circle cx="6" cy="10" r="3" fill="#475569"/>
    <!-- Iron cracks / studs -->
    <circle cx="6" cy="3" r="0.8" fill="#cbd5e1"/>
    <circle cx="6" cy="17" r="0.8" fill="#cbd5e1"/>
    <circle cx="13" cy="10" r="0.8" fill="#cbd5e1"/>
  </g>

  <!-- Right Hand: Ancient Notched Broadsword -->
  <g transform="translate(43, 14)">
    <line x1="0" y1="14" x2="4" y2="10" stroke="#f1f5f9" stroke-width="2"/>
    <!-- Blade -->
    <path d="M4 2 L6 0 L8 2 L7 24 L5 24 Z" fill="#94a3b8"/>
    <line x1="6" y1="2" x2="6" y2="24" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Notches in blade -->
    <polygon points="7,8 5,10 7,12" fill="#0a0c10"/>
    <polygon points="4,16 6,18 4,20" fill="#0a0c10"/>
    <!-- Rusty crossguard & pommel -->
    <rect x="1" y="24" width="10" height="3" rx="1" fill="#b45309"/>
    <rect x="4.5" y="27" width="3" height="5" fill="#451a03"/>
    <circle cx="6" cy="33" r="1.8" fill="#b45309"/>
  </g>
</svg>
