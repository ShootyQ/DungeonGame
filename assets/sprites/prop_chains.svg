<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Wall bracket ring -->
  <rect x="21" y="2" width="6" height="6" rx="1" fill="#1b1e26"/>
  <circle cx="24" cy="5" r="1.5" fill="#3a4254"/>
  <ellipse cx="24" cy="8" rx="3.5" ry="3" fill="none" stroke="#2c3342" stroke-width="2"/>

  <!-- Left hanging chain with shackle -->
  <g id="chain-left">
    <ellipse cx="22" cy="13" rx="2.2" ry="3.5" fill="none" stroke="#363f52" stroke-width="1.8"/>
    <ellipse cx="21" cy="18" rx="2" ry="3.5" fill="none" stroke="#48536b" stroke-width="1.8"/>
    <ellipse cx="20" cy="23" rx="2" ry="3.5" fill="none" stroke="#363f52" stroke-width="1.8"/>
    <ellipse cx="19" cy="28" rx="2" ry="3.5" fill="none" stroke="#48536b" stroke-width="1.8"/>
    <!-- Shackle / manacle cuff -->
    <path d="M15 33 C15 30 22 30 22 33 L22 38 C22 41 15 41 15 38 Z" fill="none" stroke="#5a6782" stroke-width="2"/>
    <rect x="14" y="34" width="2" height="4" fill="#2d3443"/>
    <rect x="21" y="34" width="2" height="4" fill="#2d3443"/>
  </g>

  <!-- Right hanging chain (longer) -->
  <g id="chain-right">
    <ellipse cx="26" cy="14" rx="2.2" ry="3.5" fill="none" stroke="#48536b" stroke-width="1.8"/>
    <ellipse cx="27" cy="20" rx="2" ry="3.5" fill="none" stroke="#363f52" stroke-width="1.8"/>
    <ellipse cx="29" cy="26" rx="2" ry="3.5" fill="none" stroke="#48536b" stroke-width="1.8"/>
    <ellipse cx="30" cy="32" rx="2" ry="3.5" fill="none" stroke="#363f52" stroke-width="1.8"/>
    <ellipse cx="31" cy="38" rx="2" ry="3.5" fill="none" stroke="#48536b" stroke-width="1.8"/>
    <!-- Open broken cuff at bottom -->
    <path d="M28 41 C28 39 34 39 35 43" fill="none" stroke="#6b7999" stroke-width="2"/>
  </g>
</svg>
