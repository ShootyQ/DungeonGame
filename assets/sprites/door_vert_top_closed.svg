<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Floor / shadow background -->
  <rect width="64" height="64" fill="#181b22"/>
  
  <!-- Top stone lintel & Side jamb reveals -->
  <rect x="0" y="0" width="64" height="8" fill="#4d566b"/>
  <rect x="0" y="0" width="6" height="64" fill="#383f4f"/>
  <rect x="58" y="0" width="6" height="64" fill="#383f4f"/>
  <line x1="0" y1="8" x2="64" y2="8" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Door Leaf (y=8 to 64) -->
  <rect x="6" y="8" width="52" height="56" fill="#5c2e0b"/>
  <rect x="8" y="10" width="48" height="15" fill="#78350f" rx="1"/>
  <rect x="8" y="28" width="48" height="15" fill="#78350f" rx="1"/>
  <rect x="8" y="46" width="48" height="16" fill="#78350f" rx="1"/>

  <!-- Vertical iron reinforcement bands -->
  <rect x="16" y="8" width="6" height="56" fill="#1e293b"/>
  <rect x="42" y="8" width="6" height="56" fill="#1e293b"/>
  
  <!-- Iron rivets -->
  <circle cx="19" cy="18" r="1.5" fill="#94a3b8"/>
  <circle cx="19" cy="36" r="1.5" fill="#94a3b8"/>
  <circle cx="19" cy="54" r="1.5" fill="#94a3b8"/>
  <circle cx="45" cy="18" r="1.5" fill="#94a3b8"/>
  <circle cx="45" cy="36" r="1.5" fill="#94a3b8"/>
  <circle cx="45" cy="54" r="1.5" fill="#94a3b8"/>

  <!-- Center meeting latch / Ring handle near bottom seam -->
  <circle cx="32" cy="52" r="3.5" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
  <circle cx="32" cy="49" r="1.5" fill="#94a3b8"/>

  <!-- Center meeting seam shadow -->
  <line x1="6" y1="63.5" x2="58" y2="63.5" stroke="#181b22" stroke-width="1"/>
</svg>