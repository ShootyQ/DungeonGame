<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Base Dark Stone Floor -->
  <rect width="64" height="64" fill="#12151c"/>
  
  <!-- Flagstone seams -->
  <line x1="0" y1="32" x2="64" y2="32" stroke="#080a0e" stroke-width="2"/>
  <line x1="32" y1="0" x2="32" y2="32" stroke="#080a0e" stroke-width="2"/>

  <!-- Recessed Iron Drainage Basin -->
  <rect x="14" y="14" width="36" height="36" rx="3" fill="#080a0e"/>
  <rect x="16" y="16" width="32" height="32" rx="2" fill="#1e222d" stroke="#333b4d" stroke-width="1.5"/>

  <!-- Iron Grate Slits (Dark deep pit underneath) -->
  <rect x="20" y="20" width="3" height="24" rx="1" fill="#050608"/>
  <rect x="26" y="20" width="3" height="24" rx="1" fill="#050608"/>
  <rect x="32" y="20" width="3" height="24" rx="1" fill="#050608"/>
  <rect x="38" y="20" width="3" height="24" rx="1" fill="#050608"/>
  <rect x="44" y="20" width="3" height="24" rx="1" fill="#050608"/>

  <!-- Metal rivets and rust spots -->
  <circle cx="18" cy="18" r="1.5" fill="#475569"/>
  <circle cx="46" cy="18" r="1.5" fill="#475569"/>
  <circle cx="18" cy="46" r="1.5" fill="#475569"/>
  <circle cx="46" cy="46" r="1.5" fill="#475569"/>
  <circle cx="28" cy="38" r="1.8" fill="#854d0e" opacity="0.6"/>
</svg>
