<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Floor / shadow background -->
  <rect width="64" height="64" fill="#181b22"/>
  
  <!-- Right stone pillar jamb & Top lintel -->
  <rect x="56" y="0" width="8" height="64" fill="#383f4f"/>
  <rect x="0" y="0" width="64" height="8" fill="#4d566b"/>
  <line x1="0" y1="8" x2="56" y2="8" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="56" y1="0" x2="56" y2="64" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Right Door Leaf (x=0 to 56) -->
  <rect x="0" y="8" width="56" height="52" fill="#5c2e0b"/>
  <rect x="2" y="10" width="16" height="48" fill="#78350f" rx="1"/>
  <rect x="20" y="10" width="16" height="48" fill="#78350f" rx="1"/>
  <rect x="38" y="10" width="16" height="48" fill="#78350f" rx="1"/>

  <!-- Horizontal iron reinforcement bands -->
  <rect x="0" y="18" width="56" height="6" fill="#1e293b"/>
  <rect x="0" y="44" width="56" height="6" fill="#1e293b"/>
  
  <!-- Iron rivets -->
  <circle cx="12" cy="21" r="1.5" fill="#94a3b8"/>
  <circle cx="30" cy="21" r="1.5" fill="#94a3b8"/>
  <circle cx="48" cy="21" r="1.5" fill="#94a3b8"/>
  <circle cx="12" cy="47" r="1.5" fill="#94a3b8"/>
  <circle cx="30" cy="47" r="1.5" fill="#94a3b8"/>
  <circle cx="48" cy="47" r="1.5" fill="#94a3b8"/>

  <!-- Right Ring Handle near center seam -->
  <circle cx="10" cy="33" r="3.5" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
  <circle cx="10" cy="30" r="1.5" fill="#94a3b8"/>

  <!-- Center meeting seam shadow -->
  <line x1="0.5" y1="8" x2="0.5" y2="60" stroke="#181b22" stroke-width="1"/>
  <rect x="0" y="60" width="64" height="4" fill="#181b22" opacity="0.6"/>
</svg>