<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Skeleton Shieldbearer with massive steel kite shield -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Skull in background -->
  <circle cx="28" cy="24" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="25" cy="23" rx="2.5" ry="3.5" fill="#0284c7"/>
  <ellipse cx="31" cy="23" rx="2.5" ry="3.5" fill="#0284c7"/>
  <path d="M 24 30 L 32 30" stroke="#64748b" stroke-width="2"/>
  <!-- Armored Pauldron -->
  <circle cx="20" cy="34" r="7" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <!-- Massive Front Tower Kite Shield covering the front -->
  <path d="M 30 14 L 52 14 Q 56 34 41 54 Q 26 34 30 14 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Shield Emblem / Boss -->
  <path d="M 35 20 L 47 20 Q 50 34 41 46 Q 32 34 35 20 Z" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5"/>
  <polygon points="41,26 44,32 41,38 38,32" fill="#f8fafc"/>
  <circle cx="41" cy="32" r="2" fill="#38bdf8"/>
  <!-- Spear tip peeking over shield -->
  <polygon points="48,8 52,14 44,14" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
</svg>