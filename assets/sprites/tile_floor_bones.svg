<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Base dark stone -->
  <rect width="64" height="64" fill="#181b22"/>
  
  <!-- Flagstone slabs -->
  <rect x="2" y="2" width="28" height="28" rx="2" fill="#2a303d"/>
  <rect x="2" y="2" width="28" height="2" fill="#3c4455"/>
  <rect x="2" y="2" width="2" height="28" fill="#3c4455"/>
  <rect x="2" y="28" width="28" height="2" fill="#171a21"/>
  <rect x="28" y="2" width="2" height="28" fill="#171a21"/>

  <rect x="34" y="2" width="28" height="20" rx="2" fill="#272c38"/>
  <rect x="34" y="2" width="28" height="2" fill="#373f50"/>
  <rect x="34" y="2" width="2" height="20" fill="#373f50"/>
  <rect x="34" y="20" width="28" height="2" fill="#161820"/>
  <rect x="60" y="2" width="2" height="20" fill="#161820"/>

  <rect x="34" y="26" width="28" height="36" rx="2" fill="#2c3341"/>
  <rect x="34" y="26" width="28" height="2" fill="#3f485b"/>
  <rect x="34" y="26" width="2" height="36" fill="#3f485b"/>
  <rect x="34" y="60" width="28" height="2" fill="#181b23"/>
  <rect x="60" y="26" width="2" height="36" fill="#181b23"/>

  <rect x="2" y="34" width="28" height="28" rx="2" fill="#252b36"/>
  <rect x="2" y="34" width="28" height="2" fill="#343c4b"/>
  <rect x="2" y="34" width="2" height="28" fill="#343c4b"/>
  <rect x="2" y="60" width="28" height="2" fill="#14161e"/>
  <rect x="28" y="34" width="2" height="28" fill="#14161e"/>

  <!-- Dust / ash mound -->
  <ellipse cx="32" cy="34" rx="20" ry="14" fill="#14161d" opacity="0.7"/>

  <!-- Skull on stone floor -->
  <!-- Shadow under skull -->
  <ellipse cx="28" cy="36" rx="9" ry="6" fill="#0c0e12" opacity="0.8"/>
  
  <!-- Cranium -->
  <path d="M21 28 C21 21 35 21 35 28 C35 31 34 34 32 35 L32 37 L24 37 L24 35 C22 34 21 31 21 28 Z" fill="#cfc8b8"/>
  <path d="M23 27 C23 22 33 22 33 27" fill="#e8e2d5"/>
  <!-- Eye sockets -->
  <ellipse cx="25" cy="29" rx="2.2" ry="2.6" fill="#23262e"/>
  <ellipse cx="31" cy="29" rx="2.2" ry="2.6" fill="#23262e"/>
  <!-- Nasal cavity -->
  <polygon points="28,31 27,33 29,33" fill="#23262e"/>
  <!-- Teeth / jaw line -->
  <rect x="25" y="35" width="6" height="2" fill="#a89f8c"/>
  <line x1="27" y1="35" x2="27" y2="37" stroke="#23262e" stroke-width="0.7"/>
  <line x1="29" y1="35" x2="29" y2="37" stroke="#23262e" stroke-width="0.7"/>

  <!-- Femur / broken bone nearby -->
  <path d="M38 36 L48 44" stroke="#cfc8b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="37" cy="35" r="2.2" fill="#cfc8b8"/>
  <circle cx="39" cy="37" r="1.8" fill="#cfc8b8"/>
  <circle cx="49" cy="45" r="2.2" fill="#cfc8b8"/>
  <!-- Rib fragment -->
  <path d="M16 38 C14 42 16 46 20 48" stroke="#beb7a6" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
