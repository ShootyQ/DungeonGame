<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ground cast shadow -->
  <ellipse cx="32" cy="56" rx="22" ry="7" fill="#0c0e14" opacity="0.8"/>

  <!-- Base plinth -->
  <rect x="14" y="48" width="36" height="8" rx="2" fill="#2d3340"/>
  <rect x="14" y="48" width="36" height="2" fill="#4d576a"/>
  <rect x="16" y="44" width="32" height="5" fill="#383f4f"/>
  <rect x="16" y="44" width="32" height="1.5" fill="#586378"/>

  <!-- Column shaft with fluting -->
  <rect x="20" y="14" width="24" height="31" fill="#323846"/>
  <!-- Highlight on left edge of shaft -->
  <rect x="20" y="14" width="3" height="31" fill="#4c556b"/>
  <!-- Vertical flutes -->
  <line x1="26" y1="14" x2="26" y2="45" stroke="#252a35" stroke-width="1.8"/>
  <line x1="27" y1="14" x2="27" y2="45" stroke="#3e4657" stroke-width="0.8"/>
  <line x1="32" y1="14" x2="32" y2="45" stroke="#252a35" stroke-width="1.8"/>
  <line x1="33" y1="14" x2="33" y2="45" stroke="#3e4657" stroke-width="0.8"/>
  <line x1="38" y1="14" x2="38" y2="45" stroke="#252a35" stroke-width="1.8"/>
  <line x1="39" y1="14" x2="39" y2="45" stroke="#3e4657" stroke-width="0.8"/>
  <!-- Shadow on right edge of shaft -->
  <rect x="41" y="14" width="3" height="31" fill="#1c2028"/>

  <!-- Capital (top cornice) -->
  <rect x="16" y="10" width="32" height="5" fill="#3a4252"/>
  <rect x="16" y="10" width="32" height="1.5" fill="#5c677c"/>
  <rect x="12" y="4" width="40" height="7" rx="2" fill="#2d3340"/>
  <rect x="12" y="4" width="40" height="2" fill="#545f73"/>

  <!-- Small crack across shaft -->
  <path d="M22 28 L27 33 L25 38" stroke="#171921" stroke-width="1.2" fill="none"/>
</svg>
