<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Deep shadow backing -->
  <rect width="64" height="64" fill="#0d0f15"/>
  
  <!-- Outer left rim / ledge (broken / jagged) -->
  <path d="M0 0 L12 0 L10 16 L13 28 L11 44 L12 64 L0 64 Z" fill="#323a4a"/>
  <path d="M0 0 L3 0 L3 16 L1 32 L3 48 L3 64 L0 64 Z" fill="#48536b"/>

  <!-- Bricks running vertically with cracks & missing chunks -->
  <rect x="14" y="2" width="18" height="24" rx="1" fill="#252c3a"/>
  <rect x="14" y="2" width="2" height="24" fill="#363f52"/>
  <polygon points="14,28 26,30 24,38 16,36" fill="#13161e"/>
  
  <rect x="14" y="40" width="18" height="22" rx="1" fill="#222835"/>
  <rect x="14" y="40" width="2" height="22" fill="#333b4d"/>

  <!-- Column 2 Bricks (crumbled fissure) -->
  <rect x="34" y="2" width="16" height="28" rx="1" fill="#272e3d"/>
  <rect x="34" y="2" width="2" height="28" fill="#384358"/>
  <path d="M34 14 L42 20 L38 28" stroke="#12151c" stroke-width="1.2" fill="none"/>
  
  <!-- Rubble pieces spilling toward floor -->
  <polygon points="36,44 42,40 45,46 40,49" fill="#333b4c"/>
  <polygon points="38,52 44,48 48,54 41,56" fill="#2d3443"/>

  <!-- Right edge: Drop shadow cast onto floor -->
  <rect x="52" y="0" width="12" height="64" fill="#080a0e" opacity="0.85"/>
</svg>
