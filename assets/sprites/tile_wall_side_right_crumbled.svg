<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Deep shadow backing -->
  <rect width="64" height="64" fill="#0d0f15"/>
  
  <!-- Outer right rim / ledge (broken / jagged) -->
  <path d="M52 0 L64 0 L64 64 L52 64 L54 44 L51 28 L53 16 Z" fill="#323a4a"/>
  <path d="M61 0 L64 0 L64 64 L61 64 L61 48 L63 32 L61 16 Z" fill="#48536b"/>

  <!-- Bricks running vertically with cracks & missing chunks -->
  <rect x="32" y="2" width="18" height="24" rx="1" fill="#252c3a"/>
  <rect x="48" y="2" width="2" height="24" fill="#363f52"/>
  <polygon points="48,28 36,30 38,38 46,36" fill="#13161e"/>
  
  <rect x="32" y="40" width="18" height="22" rx="1" fill="#222835"/>
  <rect x="48" y="40" width="2" height="22" fill="#333b4d"/>

  <!-- Column 1 Bricks (crumbled fissure) -->
  <rect x="14" y="2" width="16" height="28" rx="1" fill="#272e3d"/>
  <rect x="28" y="2" width="2" height="28" fill="#384358"/>
  <path d="M28 14 L20 20 L24 28" stroke="#12151c" stroke-width="1.2" fill="none"/>
  
  <!-- Rubble pieces spilling toward floor -->
  <polygon points="26,44 20,40 17,46 22,49" fill="#333b4c"/>
  <polygon points="24,52 18,48 14,54 21,56" fill="#2d3443"/>

  <!-- Left edge: Drop shadow cast onto floor -->
  <rect x="0" y="0" width="12" height="64" fill="#080a0e" opacity="0.85"/>
</svg>
