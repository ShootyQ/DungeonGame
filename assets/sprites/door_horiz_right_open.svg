<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clean stone floor visible beneath raised portcullis -->
  <rect width="64" height="64" fill="#1e2430"/>
  <rect x="2" y="12" width="24" height="22" fill="#29303d" rx="1"/>
  <rect x="28" y="12" width="24" height="22" fill="#29303d" rx="1"/>
  <rect x="2" y="38" width="24" height="24" fill="#29303d" rx="1"/>
  <rect x="28" y="38" width="24" height="24" fill="#29303d" rx="1"/>

  <!-- Right Stone Pillar Jamb -->
  <rect x="54" y="0" width="10" height="64" fill="#334155"/>
  <rect x="56" y="0" width="8" height="64" fill="#475569"/>
  <line x1="54" y1="20" x2="64" y2="20" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="54" y1="42" x2="64" y2="42" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="54" y1="0" x2="54" y2="64" stroke="#0f172a" stroke-width="2"/>

  <!-- Top Stone Lintel Arch -->
  <rect x="0" y="0" width="64" height="12" fill="#334155"/>
  <rect x="0" y="0" width="64" height="10" fill="#475569"/>
  <line x1="0" y1="12" x2="54" y2="12" stroke="#0f172a" stroke-width="2"/>

  <!-- Raised Portcullis Spikes retracted up into archway ceiling -->
  <polygon points="7,12 12,12 9.5,18" fill="#94a3b8"/>
  <polygon points="19,12 24,12 21.5,18" fill="#94a3b8"/>
  <polygon points="31,12 36,12 33.5,18" fill="#94a3b8"/>
  <polygon points="43,12 48,12 45.5,18" fill="#94a3b8"/>

  <!-- Warm ambient light spill through open doorway -->
  <polygon points="0,12 54,12 54,64 0,64" fill="#f59e0b" opacity="0.08"/>
</svg>
