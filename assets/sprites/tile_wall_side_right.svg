<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Deep shadow backing -->
  <rect width="64" height="64" fill="#0d0f15"/>
  
  <!-- Outer right rim / ledge (depth viewed from side) -->
  <rect x="52" y="0" width="12" height="64" fill="#323a4a"/>
  <rect x="61" y="0" width="3" height="64" fill="#48536b"/>
  <rect x="52" y="0" width="3" height="64" fill="#202530"/>

  <!-- Bricks running vertically (turned sideways along the up/down wall) -->
  <!-- Column 2 Bricks (near right ledge) -->
  <rect x="32" y="2" width="18" height="28" rx="1" fill="#252c3a"/>
  <rect x="48" y="2" width="2" height="28" fill="#363f52"/>
  <rect x="32" y="32" width="18" height="30" rx="1" fill="#222835"/>
  <rect x="48" y="32" width="2" height="30" fill="#333b4d"/>

  <!-- Column 1 Bricks (staggered, near floor) -->
  <rect x="14" y="2" width="16" height="14" rx="1" fill="#1f2430"/>
  <rect x="28" y="2" width="2" height="14" fill="#2e3646"/>
  <rect x="14" y="18" width="16" height="28" rx="1" fill="#272e3d"/>
  <rect x="28" y="18" width="2" height="28" fill="#384358"/>
  <rect x="14" y="48" width="16" height="14" rx="1" fill="#212733"/>
  <rect x="28" y="48" width="2" height="14" fill="#30384a"/>

  <!-- Left edge: Drop shadow cast onto the floor to the west -->
  <rect x="0" y="0" width="12" height="64" fill="#080a0e" opacity="0.85"/>
  <rect x="8" y="0" width="4" height="64" fill="#050608" opacity="0.95"/>
</svg>
