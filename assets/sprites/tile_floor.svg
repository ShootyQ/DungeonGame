<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Deep mortar bed -->
  <rect width="64" height="64" fill="#141822"/>
  
  <!-- Flagstone slabs - distinct stone pavement tone with clear bevels -->
  <!-- Slab 1: Top-left -->
  <rect x="2" y="2" width="28" height="28" rx="2" fill="#3b4456"/>
  <rect x="2" y="2" width="28" height="2" fill="#58657e"/>
  <rect x="2" y="2" width="2" height="28" fill="#58657e"/>
  <rect x="2" y="28" width="28" height="2" fill="#252b38"/>
  <rect x="28" y="2" width="2" height="28" fill="#252b38"/>
  <circle cx="16" cy="16" r="1.5" fill="#323a4a"/>

  <!-- Slab 2: Top-right -->
  <rect x="34" y="2" width="28" height="20" rx="2" fill="#363f50"/>
  <rect x="34" y="2" width="28" height="2" fill="#525e76"/>
  <rect x="34" y="2" width="2" height="20" fill="#525e76"/>
  <rect x="34" y="20" width="28" height="2" fill="#222833"/>
  <rect x="60" y="2" width="2" height="20" fill="#222833"/>

  <!-- Slab 3: Mid-right -->
  <rect x="34" y="26" width="28" height="36" rx="2" fill="#3e485b"/>
  <rect x="34" y="26" width="28" height="2" fill="#5c6a84"/>
  <rect x="34" y="26" width="2" height="36" fill="#5c6a84"/>
  <rect x="34" y="60" width="28" height="2" fill="#252b38"/>
  <rect x="60" y="26" width="2" height="36" fill="#252b38"/>
  <circle cx="48" cy="44" r="2" fill="#333b4b"/>

  <!-- Slab 4: Bottom-left -->
  <rect x="2" y="34" width="28" height="28" rx="2" fill="#343d4e"/>
  <rect x="2" y="34" width="28" height="2" fill="#4f5b72"/>
  <rect x="2" y="34" width="2" height="28" fill="#4f5b72"/>
  <rect x="2" y="60" width="28" height="2" fill="#202632"/>
  <rect x="28" y="34" width="2" height="28" fill="#202632"/>
  
  <!-- Subtle stone fleck / wear -->
  <circle cx="12" cy="46" r="1.5" fill="#2b3240"/>
  <circle cx="31" cy="31" r="1.5" fill="#1b202c"/>
</svg>
