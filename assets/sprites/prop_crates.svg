<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ground cast shadow -->
  <ellipse cx="32" cy="54" rx="28" ry="8" fill="#0b0d12" opacity="0.75"/>

  <!-- Left: Wooden Barrel -->
  <g id="barrel">
    <!-- Barrel body staves -->
    <path d="M8 26 C6 38 6 46 9 54 L25 54 C28 46 28 38 26 26 Z" fill="#6d4726"/>
    <!-- Wood stave planks -->
    <path d="M12 26 C11 38 11 46 13 54" stroke="#4a2e16" stroke-width="1.2" fill="none"/>
    <path d="M17 26 C17 38 17 46 17 54" stroke="#4a2e16" stroke-width="1.2" fill="none"/>
    <path d="M22 26 C23 38 23 46 21 54" stroke="#4a2e16" stroke-width="1.2" fill="none"/>
    <!-- Barrel top lid -->
    <ellipse cx="17" cy="26" rx="9" ry="3.5" fill="#8a5c33"/>
    <ellipse cx="17" cy="26" rx="7.5" ry="2.5" fill="#6d4726"/>
    <!-- Iron hoops / bands -->
    <path d="M7 32 C12 34 22 34 27 32" stroke="#2c3340" stroke-width="2.5" fill="none"/>
    <path d="M6.5 46 C12 48 22 48 27.5 46" stroke="#2c3340" stroke-width="2.5" fill="none"/>
    <!-- Hoop highlights -->
    <path d="M8 31 C12 33 22 33 26 31" stroke="#4a556b" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Right: Large Wooden Crate -->
  <g id="crate-large">
    <!-- Shadow under crate -->
    <rect x="26" y="24" width="34" height="32" rx="2" fill="#54371f"/>
    <!-- Outer wooden framing -->
    <rect x="27" y="25" width="32" height="30" fill="#754f2c"/>
    <rect x="27" y="25" width="32" height="4" fill="#8c6138"/>
    <rect x="27" y="51" width="32" height="4" fill="#4d321b"/>
    <rect x="27" y="25" width="4" height="30" fill="#8c6138"/>
    <rect x="55" y="25" width="4" height="30" fill="#4d321b"/>
    <!-- Diagonal bracing slats -->
    <line x1="31" y1="29" x2="55" y2="51" stroke="#54371f" stroke-width="4"/>
    <line x1="31" y1="29" x2="55" y2="51" stroke="#805630" stroke-width="2.2"/>
    <line x1="31" y1="51" x2="55" y2="29" stroke="#54371f" stroke-width="4"/>
    <line x1="31" y1="51" x2="55" y2="29" stroke="#6b4624" stroke-width="2.2"/>
    <!-- Iron corner brackets and nails -->
    <rect x="27" y="25" width="5" height="5" fill="#242b36"/>
    <rect x="54" y="25" width="5" height="5" fill="#242b36"/>
    <rect x="27" y="50" width="5" height="5" fill="#242b36"/>
    <rect x="54" y="50" width="5" height="5" fill="#242b36"/>
    <circle cx="29.5" cy="27.5" r="0.8" fill="#d1d5db"/>
    <circle cx="56.5" cy="27.5" r="0.8" fill="#d1d5db"/>
  </g>

  <!-- Top: Small Crate stacked above -->
  <g id="crate-small">
    <rect x="34" y="8" width="22" height="18" rx="1.5" fill="#664426"/>
    <rect x="35" y="9" width="20" height="16" fill="#805631"/>
    <rect x="35" y="9" width="20" height="3" fill="#996a3e"/>
    <line x1="37" y1="12" x2="53" y2="23" stroke="#5c3c1e" stroke-width="2.5"/>
    <line x1="37" y1="12" x2="53" y2="23" stroke="#8a5e37" stroke-width="1.2"/>
    <!-- Iron nails -->
    <circle cx="36.5" cy="10.5" r="0.7" fill="#242b36"/>
    <circle cx="53.5" cy="10.5" r="0.7" fill="#242b36"/>
  </g>
</svg>
