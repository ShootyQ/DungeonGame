<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Floor visible beneath archway -->
  <rect width="64" height="64" fill="#2d3340"/>
  <rect x="8" y="10" width="22" height="24" fill="#333a48" rx="1"/>
  <rect x="34" y="10" width="22" height="24" fill="#333a48" rx="1"/>
  <rect x="8" y="38" width="22" height="24" fill="#333a48" rx="1"/>
  <rect x="34" y="38" width="22" height="24" fill="#333a48" rx="1"/>
  
  <!-- Top stone lintel & Side jambs -->
  <rect x="0" y="0" width="64" height="8" fill="#4d566b"/>
  <rect x="0" y="0" width="6" height="64" fill="#383f4f"/>
  <rect x="58" y="0" width="6" height="64" fill="#383f4f"/>

  <!-- Top Door leaf swung open upward against top lintel -->
  <polygon points="6,8 14,16 50,16 58,8" fill="#451a03"/>
  <line x1="14" y1="16" x2="50" y2="16" stroke="#1e293b" stroke-width="2"/>
  <circle cx="24" cy="12" r="1.5" fill="#94a3b8"/>
  <circle cx="40" cy="12" r="1.5" fill="#94a3b8"/>

  <!-- Warm ambient light spill through top portal -->
  <polygon points="14,16 50,16 58,64 6,64" fill="#fef08a" opacity="0.12"/>
</svg>