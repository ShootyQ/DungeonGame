<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Deep shadow backing -->
  <rect width="64" height="64" fill="#0d1017"/>
  
  <!-- Wall top rim (ledge depth) -->
  <rect x="0" y="0" width="64" height="14" fill="#3f4a47"/>
  <rect x="0" y="0" width="64" height="3" fill="#5a6c66"/>
  <rect x="0" y="11" width="64" height="3" fill="#242e2a"/>
  
  <!-- Moss dripping over rim -->
  <path d="M12 2 Q14 14 16 10 Q18 16 21 12 Q23 7 24 2 Z" fill="#275638"/>
  <path d="M42 2 Q44 12 47 15 Q50 9 52 14 Q54 6 55 2 Z" fill="#275638"/>
  <circle cx="17" cy="11" r="1.5" fill="#3b7a52"/>
  <circle cx="48" cy="13" r="1.5" fill="#3b7a52"/>
  
  <!-- Row 1 Bricks -->
  <rect x="2" y="16" width="28" height="13" rx="1" fill="#333d3c"/>
  <rect x="2" y="16" width="28" height="2" fill="#465452"/>
  <rect x="32" y="16" width="30" height="13" rx="1" fill="#313938"/>
  <rect x="32" y="16" width="30" height="2" fill="#43504e"/>
  
  <!-- Moss patches between row 1 & 2 -->
  <path d="M24 26 Q27 33 30 31 Q33 34 35 28 Z" fill="#224d31"/>
  <path d="M26 28 Q29 32 31 30 Z" fill="#37754b"/>
  
  <!-- Row 2 Bricks -->
  <rect x="2" y="31" width="14" height="14" rx="1" fill="#2f3737"/>
  <rect x="2" y="31" width="14" height="2" fill="#404c4b"/>
  <rect x="18" y="31" width="28" height="14" rx="1" fill="#343e3c"/>
  <rect x="18" y="31" width="28" height="2" fill="#495754"/>
  <rect x="48" y="31" width="14" height="14" rx="1" fill="#2d3534"/>
  <rect x="48" y="31" width="14" height="2" fill="#3e4a49"/>
  
  <!-- Row 3 Bricks -->
  <rect x="2" y="47" width="26" height="15" rx="1" fill="#262e2d"/>
  <rect x="30" y="47" width="32" height="15" rx="1" fill="#242b2b"/>
  
  <!-- Overgrown lichen / vine tendrils creeping up from bottom -->
  <path d="M6 62 Q9 52 13 54 Q16 48 18 56 Q21 51 24 62 Z" fill="#245034"/>
  <circle cx="14" cy="53" r="1.8" fill="#387a50"/>
  <circle cx="17" cy="51" r="1.2" fill="#4ea66f"/>
  <path d="M44 62 Q47 55 50 58 Q53 53 56 62 Z" fill="#20462d"/>
  
  <!-- Bottom cast shadow -->
  <rect x="0" y="60" width="64" height="4" fill="#080a09" opacity="0.8"/>
</svg>
