<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Deep solid bedrock stone -->
  <rect width="64" height="64" fill="#101218"/>
  
  <!-- Chiseled stone blocks (continuous pattern without horizontal ledge stripes) -->
  <rect x="2" y="2" width="28" height="18" rx="1" fill="#1b1f2a"/>
  <rect x="2" y="2" width="28" height="1.5" fill="#282e3e"/>
  <rect x="32" y="2" width="30" height="18" rx="1" fill="#181c26"/>
  <rect x="32" y="2" width="30" height="1.5" fill="#242938"/>

  <rect x="2" y="22" width="14" height="18" rx="1" fill="#191d28"/>
  <rect x="2" y="22" width="14" height="1.5" fill="#252a3a"/>
  <rect x="18" y="22" width="28" height="18" rx="1" fill="#1d222e"/>
  <rect x="18" y="22" width="28" height="1.5" fill="#2a3042"/>
  <rect x="48" y="22" width="14" height="18" rx="1" fill="#171b25"/>
  <rect x="48" y="22" width="14" height="1.5" fill="#232836"/>

  <rect x="2" y="42" width="26" height="20" rx="1" fill="#1a1e29"/>
  <rect x="2" y="42" width="26" height="1.5" fill="#262c3b"/>
  <rect x="30" y="42" width="32" height="20" rx="1" fill="#181c27"/>
  <rect x="30" y="42" width="32" height="1.5" fill="#242a39"/>

  <!-- Subtle natural texture flecks -->
  <circle cx="22" cy="11" r="1" fill="#12141c"/>
  <circle cx="38" cy="31" r="1.2" fill="#12141c"/>
  <circle cx="14" cy="52" r="1" fill="#12141c"/>
</svg>
