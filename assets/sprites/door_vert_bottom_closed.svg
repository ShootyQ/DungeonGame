<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Floor / shadow background -->
  <rect width="64" height="64" fill="#181b22"/>
  
  <!-- Bottom stone threshold & Side jamb reveals -->
  <rect x="0" y="56" width="64" height="8" fill="#4d566b"/>
  <rect x="0" y="0" width="6" height="64" fill="#383f4f"/>
  <rect x="58" y="0" width="6" height="64" fill="#383f4f"/>
  <line x1="0" y1="56" x2="64" y2="56" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Bottom Door Leaf (y=0 to 56) -->
  <rect x="6" y="0" width="52" height="56" fill="#5c2e0b"/>
  <rect x="8" y="2" width="48" height="15" fill="#78350f" rx="1"/>
  <rect x="8" y="20" width="48" height="15" fill="#78350f" rx="1"/>
  <rect x="8" y="38" width="48" height="15" fill="#78350f" rx="1"/>

  <!-- Vertical iron reinforcement bands -->
  <rect x="16" y="0" width="6" height="56" fill="#1e293b"/>
  <rect x="42" y="0" width="6" height="56" fill="#1e293b"/>
  
  <!-- Iron rivets -->
  <circle cx="19" cy="10" r="1.5" fill="#94a3b8"/>
  <circle cx="19" cy="28" r="1.5" fill="#94a3b8"/>
  <circle cx="19" cy="46" r="1.5" fill="#94a3b8"/>
  <circle cx="45" cy="10" r="1.5" fill="#94a3b8"/>
  <circle cx="45" cy="28" r="1.5" fill="#94a3b8"/>
  <circle cx="45" cy="46" r="1.5" fill="#94a3b8"/>

  <!-- Center meeting latch / Ring handle near top seam -->
  <circle cx="32" cy="12" r="3.5" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
  <circle cx="32" cy="15" r="1.5" fill="#94a3b8"/>

  <!-- Center meeting seam shadow -->
  <line x1="6" y1="0.5" x2="58" y2="0.5" stroke="#181b22" stroke-width="1"/>
</svg>