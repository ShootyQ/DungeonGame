<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark floor & doorway shadow -->
  <rect width="64" height="64" fill="#0b0f17"/>
  <rect x="10" y="0" width="44" height="54" fill="#131823"/>

  <!-- Left & Right Stone Jambs -->
  <rect x="0" y="0" width="10" height="64" fill="#334155"/>
  <rect x="0" y="0" width="8" height="64" fill="#475569"/>
  <line x1="0" y1="32" x2="10" y2="32" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="10" y1="0" x2="10" y2="64" stroke="#0f172a" stroke-width="2"/>

  <rect x="54" y="0" width="10" height="64" fill="#334155"/>
  <rect x="56" y="0" width="8" height="64" fill="#475569"/>
  <line x1="54" y1="32" x2="64" y2="32" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="54" y1="0" x2="54" y2="64" stroke="#0f172a" stroke-width="2"/>

  <!-- Bottom Stone Threshold -->
  <rect x="0" y="56" width="64" height="8" fill="#334155"/>
  <rect x="0" y="58" width="64" height="6" fill="#1e293b"/>
  <line x1="0" y1="56" x2="64" y2="56" stroke="#475569" stroke-width="1.5"/>

  <!-- Vertical Iron Bars (Bottom Half) terminating in sharp floor spikes -->
  <!-- Bar 1 (x=17) -->
  <rect x="17" y="0" width="5" height="48" fill="#1e293b"/>
  <rect x="18" y="0" width="2" height="48" fill="#64748b"/>
  <polygon points="17,48 22,48 19.5,56" fill="#94a3b8"/>

  <!-- Bar 2 (x=29) -->
  <rect x="29" y="0" width="5" height="48" fill="#1e293b"/>
  <rect x="30" y="0" width="2" height="48" fill="#64748b"/>
  <polygon points="29,48 34,48 31.5,56" fill="#94a3b8"/>

  <!-- Bar 3 (x=41) -->
  <rect x="41" y="0" width="5" height="48" fill="#1e293b"/>
  <rect x="42" y="0" width="2" height="48" fill="#64748b"/>
  <polygon points="41,48 46,48 43.5,56" fill="#94a3b8"/>

  <!-- Horizontal Cross-Brace -->
  <rect x="10" y="24" width="44" height="5" fill="#1e293b"/>
  <rect x="10" y="25" width="44" height="2" fill="#475569"/>

  <!-- Stud Rivets -->
  <circle cx="19.5" cy="26.5" r="1.5" fill="#cbd5e1"/>
  <circle cx="31.5" cy="26.5" r="1.5" fill="#cbd5e1"/>
  <circle cx="43.5" cy="26.5" r="1.5" fill="#cbd5e1"/>
</svg>
