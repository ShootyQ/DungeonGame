<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Base dark stone -->
  <rect width="64" height="64" fill="#181b22"/>
  
  <!-- Flagstone slabs -->
  <rect x="2" y="2" width="28" height="28" rx="2" fill="#292f3b"/>
  <rect x="2" y="2" width="28" height="2" fill="#3b4252"/>
  <rect x="2" y="2" width="2" height="28" fill="#3b4252"/>
  <rect x="2" y="28" width="28" height="2" fill="#181b22"/>
  <rect x="28" y="2" width="2" height="28" fill="#181b22"/>

  <rect x="34" y="2" width="28" height="20" rx="2" fill="#262b37"/>
  <rect x="34" y="2" width="28" height="2" fill="#363e4e"/>
  <rect x="34" y="2" width="2" height="20" fill="#363e4e"/>
  <rect x="34" y="20" width="28" height="2" fill="#161921"/>
  <rect x="60" y="2" width="2" height="20" fill="#161921"/>

  <rect x="34" y="26" width="28" height="36" rx="2" fill="#2b323f"/>
  <rect x="34" y="26" width="28" height="2" fill="#3d4658"/>
  <rect x="34" y="26" width="2" height="36" fill="#3d4658"/>
  <rect x="34" y="60" width="28" height="2" fill="#181b23"/>
  <rect x="60" y="26" width="2" height="36" fill="#181b23"/>

  <rect x="2" y="34" width="28" height="28" rx="2" fill="#242934"/>
  <rect x="2" y="34" width="28" height="2" fill="#333b49"/>
  <rect x="2" y="34" width="2" height="28" fill="#333b49"/>
  <rect x="2" y="60" width="28" height="2" fill="#14171d"/>
  <rect x="28" y="34" width="2" height="28" fill="#14171d"/>

  <!-- Dust / dirt spill -->
  <ellipse cx="32" cy="34" rx="22" ry="16" fill="#1c1f28" opacity="0.6"/>

  <!-- Scattered gravel & rubble chunks -->
  <!-- Chunk 1: Larger rock -->
  <polygon points="26,30 33,26 38,31 35,37 28,36" fill="#434b5c"/>
  <polygon points="27,31 32,28 36,31 31,34" fill="#59637a"/>
  <!-- Shadow under Chunk 1 -->
  <ellipse cx="33" cy="38" rx="6" ry="2" fill="#101217" opacity="0.7"/>

  <!-- Chunk 2: Medium stone -->
  <polygon points="18,38 23,35 25,40 20,43" fill="#3b4252"/>
  <polygon points="19,39 22,37 24,40 21,41" fill="#4e576c"/>

  <!-- Chunk 3: Pointy rock -->
  <polygon points="38,40 43,36 46,42 41,44" fill="#3e4657"/>
  <polygon points="39,40 42,38 44,41 41,43" fill="#525d73"/>

  <!-- Pebbles -->
  <circle cx="15" cy="27" r="2.2" fill="#4a5266"/>
  <circle cx="28" cy="22" r="1.8" fill="#394050"/>
  <circle cx="44" cy="28" r="2" fill="#485063"/>
  <circle cx="34" cy="46" r="1.6" fill="#3d4454"/>
  <circle cx="24" cy="46" r="1.4" fill="#464e61"/>
  <circle cx="47" cy="46" r="1.5" fill="#363c4a"/>
</svg>
