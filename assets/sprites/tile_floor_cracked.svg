<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Base dark stone -->
  <rect width="64" height="64" fill="#181b22"/>
  
  <!-- Flagstone slabs -->
  <!-- Slab 1: Top-left with prominent impact fracture -->
  <rect x="2" y="2" width="28" height="28" rx="2" fill="#2c323e"/>
  <rect x="2" y="2" width="28" height="2" fill="#3e4656"/>
  <rect x="2" y="2" width="2" height="28" fill="#3e4656"/>
  <rect x="2" y="28" width="28" height="2" fill="#191c24"/>
  <rect x="28" y="2" width="2" height="28" fill="#191c24"/>
  <!-- Fracture spidering from center of slab -->
  <path d="M14 14 L8 6 M14 14 L22 8 M14 14 L20 22 M14 14 L6 20 M14 14 L15 26" stroke="#13161c" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M14 14 L10 8 M14 14 L18 20" stroke="#0b0d11" stroke-width="0.8" fill="none"/>

  <!-- Slab 2: Top-right -->
  <rect x="34" y="2" width="28" height="20" rx="2" fill="#282e3a"/>
  <rect x="34" y="2" width="28" height="2" fill="#384050"/>
  <rect x="34" y="2" width="2" height="20" fill="#384050"/>
  <rect x="34" y="20" width="28" height="2" fill="#181b23"/>
  <rect x="60" y="2" width="2" height="20" fill="#181b23"/>
  <!-- Diagonal crack across top right -->
  <path d="M38 4 L48 12 L56 10" stroke="#171a21" stroke-width="1.2" fill="none"/>

  <!-- Slab 3: Mid-right (shattered corner) -->
  <rect x="34" y="26" width="28" height="36" rx="2" fill="#2d3442"/>
  <rect x="34" y="26" width="28" height="2" fill="#40495c"/>
  <rect x="34" y="26" width="2" height="36" fill="#40495c"/>
  <rect x="34" y="60" width="28" height="2" fill="#1b1f28"/>
  <rect x="60" y="26" width="2" height="36" fill="#1b1f28"/>
  <path d="M34 40 L44 48 L40 56 M44 48 L56 50" stroke="#161921" stroke-width="1.3" fill="none"/>
  <!-- Chipped chunk missing -->
  <polygon points="56,26 62,32 58,34 54,28" fill="#1a1e27"/>

  <!-- Slab 4: Bottom-left -->
  <rect x="2" y="34" width="28" height="28" rx="2" fill="#252a35"/>
  <rect x="2" y="34" width="28" height="2" fill="#353d4c"/>
  <rect x="2" y="34" width="2" height="28" fill="#353d4c"/>
  <rect x="2" y="60" width="28" height="2" fill="#15181f"/>
  <rect x="28" y="34" width="2" height="28" fill="#15181f"/>
  <path d="M10 40 L16 48 L12 56" stroke="#161920" stroke-width="1.2" fill="none"/>
  
  <!-- Subtle dirt in cracks -->
  <circle cx="14" cy="14" r="1.5" fill="#121419"/>
  <circle cx="44" cy="48" r="1.5" fill="#121419"/>
</svg>
