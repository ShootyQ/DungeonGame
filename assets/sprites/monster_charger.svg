<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Goblin Charger (Standing full character sprite) -->
  <!-- Shadow -->
  <ellipse cx="32" cy="57" rx="16" ry="5" fill="#0a0c10" opacity="0.6"/>

  <!-- Heavy Spiked Greaves & Sturdy Legs -->
  <rect x="23" y="47" width="7" height="9" rx="1" fill="#475569"/>
  <rect x="34" y="47" width="7" height="9" rx="1" fill="#475569"/>
  <rect x="21" y="53" width="9" height="4" rx="1" fill="#1e293b"/>
  <rect x="34" y="53" width="9" height="4" rx="1" fill="#1e293b"/>

  <!-- Armored Goblin Body (Hunched forward, aggressive charging stance) -->
  <path d="M22 30 L42 30 L45 48 L19 48 Z" fill="#78350f"/>
  <rect x="24" y="32" width="16" height="14" rx="2" fill="#64748b"/>
  <rect x="26" y="34" width="12" height="10" rx="1" fill="#94a3b8"/>
  <!-- Spiked Iron Belt -->
  <rect x="21" y="44" width="22" height="4" fill="#334155"/>
  <polygon points="26,44 28,41 30,44" fill="#cbd5e1"/>
  <polygon points="34,44 36,41 38,44" fill="#cbd5e1"/>

  <!-- Left Arm: Spiked Battering Pavise / Ram Shield -->
  <g transform="translate(10, 26)">
    <!-- Spiked heavy bronze buckler -->
    <path d="M4 0 L14 4 L12 24 L2 20 Z" fill="#b45309"/>
    <path d="M6 3 L12 6 L10 21 L4 18 Z" fill="#d97706"/>
    <!-- Iron Ramming Spikes -->
    <polygon points="2,10 -3,12 2,14" fill="#cbd5e1"/>
    <polygon points="3,4 -2,6 3,8" fill="#cbd5e1"/>
    <polygon points="1,16 -4,18 1,20" fill="#cbd5e1"/>
  </g>

  <!-- Goblin Head & Massive Ram Horned Iron Greathelm -->
  <ellipse cx="32" cy="24" rx="11" ry="9" fill="#22c55e"/>
  <!-- Iron horned Greathelm -->
  <path d="M22 14 C22 8, 42 8, 42 14 L44 26 L20 26 Z" fill="#475569"/>
  <path d="M24 13 C24 10, 40 10, 40 13 L41 22 L23 22 Z" fill="#64748b"/>
  <!-- Ram Horns -->
  <!-- Left Horn -->
  <path d="M22 16 C12 12, 10 2, 18 2 C16 6, 18 10, 24 13 Z" fill="#b45309"/>
  <path d="M18 2 C16 4, 18 7, 22 10" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <!-- Right Horn -->
  <path d="M42 16 C52 12, 54 2, 46 2 C48 6, 46 10, 40 13 Z" fill="#b45309"/>
  <path d="M46 2 C48 4, 46 7, 42 10" stroke="#f59e0b" stroke-width="1.2" fill="none"/>

  <!-- Visor Slit (Crimson glowing eyes inside) -->
  <rect x="25" y="20" width="14" height="4" rx="1" fill="#0f172a"/>
  <circle cx="28.5" cy="22" r="1.5" fill="#ef4444"/>
  <circle cx="28.5" cy="22" r="0.7" fill="#fef08a"/>
  <circle cx="35.5" cy="22" r="1.5" fill="#ef4444"/>
  <circle cx="35.5" cy="22" r="0.7" fill="#fef08a"/>

  <!-- Snarl & Goblin Tusks peeking out beneath helm -->
  <polygon points="28,26 29,29 30,26" fill="#fef08a"/>
  <polygon points="34,26 35,29 36,26" fill="#fef08a"/>

  <!-- Right Arm: Heavy Spiked Morningstar / Club -->
  <g transform="translate(44, 20)">
    <line x1="2" y1="6" x2="10" y2="28" stroke="#78350f" stroke-width="3"/>
    <!-- Iron Spiked Ball -->
    <circle cx="11" cy="29" r="6" fill="#475569"/>
    <circle cx="10" cy="28" r="4" fill="#64748b"/>
    <!-- Spikes -->
    <polygon points="11,21 13,23 9,23" fill="#cbd5e1"/>
    <polygon points="18,29 16,31 16,27" fill="#cbd5e1"/>
    <polygon points="11,37 9,35 13,35" fill="#cbd5e1"/>
    <polygon points="4,29 6,27 6,31" fill="#cbd5e1"/>
  </g>
</svg>
