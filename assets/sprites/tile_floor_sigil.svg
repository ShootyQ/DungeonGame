<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Deep mortar bed -->
  <rect width="64" height="64" fill="#141822"/>
  
  <!-- Flagstone slab -->
  <rect x="2" y="2" width="60" height="60" rx="3" fill="#2d3544"/>
  <rect x="4" y="4" width="56" height="56" rx="2" fill="#262d3a"/>

  <!-- Arcane Glowing Sigil Inscribed in Stone -->
  <circle cx="32" cy="32" r="24" stroke="#ff7722" stroke-width="1.4" fill="none" opacity="0.7"/>
  <circle cx="32" cy="32" r="21" stroke="#ffaa33" stroke-width="1.0" fill="none" opacity="0.85"/>
  <circle cx="32" cy="32" r="13" stroke="#ffd066" stroke-width="1.4" fill="none" opacity="0.95"/>

  <!-- Geometric star -->
  <polygon points="32,12 49,42 15,42" stroke="#ff8822" stroke-width="1.4" fill="none" opacity="0.8"/>
  <polygon points="32,52 49,22 15,22" stroke="#ff8822" stroke-width="1.4" fill="none" opacity="0.8"/>

  <circle cx="32" cy="32" r="5" fill="#ff5511" opacity="0.8"/>
  <circle cx="32" cy="32" r="3" fill="#ffcc44"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>

  <line x1="32" y1="8" x2="32" y2="12" stroke="#ffbb44" stroke-width="2.0"/>
  <line x1="32" y1="52" x2="32" y2="56" stroke="#ffbb44" stroke-width="2.0"/>
  <line x1="8" y1="32" x2="12" y2="32" stroke="#ffbb44" stroke-width="2.0"/>
  <line x1="52" y1="32" x2="56" y2="32" stroke="#ffbb44" stroke-width="2.0"/>

  <circle cx="20" cy="18" r="1.6" fill="#ffa033"/>
  <circle cx="44" cy="18" r="1.6" fill="#ffa033"/>
  <circle cx="44" cy="46" r="1.6" fill="#ffa033"/>
  <circle cx="20" cy="46" r="1.6" fill="#ffa033"/>
</svg>
