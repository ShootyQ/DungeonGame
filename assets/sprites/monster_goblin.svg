<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Goblin Rogue / Scout / Berserker (Standing full character sprite) -->
  <!-- Shadow -->
  <ellipse cx="32" cy="56" rx="16" ry="5" fill="#0a0c10" opacity="0.6"/>

  <!-- Agile Hunched Legs & Clawed Wrapped Boots -->
  <rect x="22" y="46" width="6" height="8" rx="1" fill="#15803d"/>
  <rect x="36" y="46" width="6" height="8" rx="1" fill="#15803d"/>
  <!-- Dark leather wraps on boots -->
  <rect x="21" y="51" width="8" height="4" rx="1" fill="#451a03"/>
  <rect x="35" y="51" width="8" height="4" rx="1" fill="#451a03"/>
  <!-- Clawed toes -->
  <polygon points="21,55 19,56 22,56" fill="#fef08a"/>
  <polygon points="41,55 43,56 40,56" fill="#fef08a"/>

  <!-- Ragged Studded Leather Jerkin / Tunic -->
  <path d="M22 30 L42 30 L45 48 L19 48 Z" fill="#78350f"/>
  <path d="M24 32 L40 32 L43 47 L21 47 Z" fill="#92400e"/>
  <!-- Skull buckle & belt -->
  <rect x="20" y="42" width="24" height="4" fill="#27272a"/>
  <polygon points="31,41 33,41 33,45 31,45" fill="#e2e8f0"/>
  <!-- Bronze armor studs -->
  <circle cx="26" cy="35" r="1.2" fill="#d97706"/>
  <circle cx="38" cy="35" r="1.2" fill="#d97706"/>
  <circle cx="26" cy="39" r="1.2" fill="#d97706"/>
  <circle cx="38" cy="39" r="1.2" fill="#d97706"/>

  <!-- Left Arm: Reverse-grip Wicked Serrated Bone Dagger -->
  <g transform="translate(10, 28)">
    <rect x="2" y="4" width="6" height="8" rx="2" fill="#15803d"/>
    <!-- Blade pointing down -->
    <path d="M4 12 L1 26 L5 25 L5 12 Z" fill="#cbd5e1"/>
    <path d="M3 13 L2 24 L4 23 L4 13 Z" fill="#f8fafc"/>
    <!-- Jagged serration -->
    <polygon points="5,16 7,18 5,19" fill="#0f172a"/>
    <polygon points="5,21 7,23 5,24" fill="#0f172a"/>
    <!-- Leather wrapped hilt -->
    <rect x="2" y="10" width="5" height="3" fill="#451a03"/>
  </g>

  <!-- Right Arm: Raised Barbed Scimitar / Cleaver -->
  <g transform="translate(44, 16)">
    <!-- Arm -->
    <rect x="0" y="8" width="6" height="8" rx="2" fill="#15803d"/>
    <!-- Curved Scimitar Blade -->
    <path d="M4 8 Q12 0 16 -4 Q14 8 8 12 Z" fill="#94a3b8"/>
    <path d="M5 7 Q11 1 14 -2 Q13 6 8 10 Z" fill="#f1f5f9"/>
    <!-- Crossguard & handle -->
    <rect x="1" y="9" width="6" height="3" rx="1" fill="#b45309"/>
    <rect x="2.5" y="12" width="3" height="5" fill="#451a03"/>
  </g>

  <!-- Goblin Head & Pointed Ears -->
  <!-- Left Large Pointed Ear with Gold Hoop -->
  <polygon points="10,16 23,22 20,28" fill="#16a34a"/>
  <polygon points="12,18 21,22 19,26" fill="#15803d"/>
  <circle cx="12" cy="20" r="1.8" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <!-- Right Large Pointed Ear with Notch -->
  <polygon points="54,16 41,22 44,28" fill="#16a34a"/>
  <polygon points="52,18 43,22 45,26" fill="#15803d"/>
  <polygon points="50,17 52,19 49,19" fill="#0a0c10"/>

  <!-- Face Shape -->
  <ellipse cx="32" cy="23" rx="12" ry="10" fill="#22c55e"/>
  <ellipse cx="32" cy="24" rx="10" ry="8" fill="#16a34a"/>

  <!-- Crimson War Mask / Bandit Headband -->
  <rect x="20" y="18" width="24" height="4" fill="#dc2626"/>
  <polygon points="19,19 16,16 18,22" fill="#b91c1c"/>

  <!-- Menacing Piercing Eyes -->
  <ellipse cx="27" cy="22" rx="3" ry="2" fill="#facc15"/>
  <ellipse cx="27.5" cy="22" rx="1" ry="1.8" fill="#000000"/>
  <circle cx="28" cy="21.5" r="0.6" fill="#ffffff"/>

  <ellipse cx="37" cy="22" rx="3" ry="2" fill="#facc15"/>
  <ellipse cx="36.5" cy="22" rx="1" ry="1.8" fill="#000000"/>
  <circle cx="37" cy="21.5" r="0.6" fill="#ffffff"/>

  <!-- Sneering Mouth with Protruding Sharp Fangs -->
  <path d="M26 27 Q32 31 38 27" stroke="#14532d" stroke-width="2" fill="none"/>
  <polygon points="27,27 28.5,24 30,27" fill="#fef9c3"/>
  <polygon points="34,27 35.5,24 37,27" fill="#fef9c3"/>
</svg>
