  <path d="M32 24 C28 28 26 31 26 34 C26 38 29 40 32 40 C35 40 38 38 38 34 C38 31 36 28 32 24 Z" fill="#f97316"/>
  <circle cx="32" cy="34" r="3" fill="#fde047"/>
