      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="#ea580c" fill-opacity="0.12"/>
