      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="#ef4444" fill-opacity="0.12"/>
  <g transform="rotate(45 32 32)">
    <!-- Long Haft -->
    <rect x="30" y="6" width="4" height="54" rx="2" fill="#292524"/>
    <rect x="29" y="30" width="6" height="20" rx="1" fill="#44403c"/>
