<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hammer_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bronze_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="#f59e0b" fill-opacity="0.1"/>
  <g transform="rotate(45 32 32)">
    <!-- Long two-handed shaft -->
    <rect x="30" y="8" width="4" height="50" rx="1.5" fill="#451a03"/>
    <rect x="29.5" y="32" width="5" height="18" rx="1" fill="#78350f"/>
    <!-- Shaft reinforcement bands -->
    <rect x="29" y="16" width="6" height="2" fill="url(#bronze_grad)"/>
    <rect x="29" y="24" width="6" height="2" fill="url(#bronze_grad)"/>
    <rect x="29" y="52" width="6" height="2" fill="url(#bronze_grad)"/>
    <!-- Heavy Warhammer Head -->
    <rect x="18" y="8" width="28" height="14" rx="3" fill="url(#hammer_metal)"/>
    <!-- Crushing face left -->
    <rect x="16" y="9" width="3" height="12" rx="1" fill="#94a3b8"/>
    <!-- Rear Spike right -->
    <polygon points="46,11 54,15 46,19" fill="url(#hammer_metal)"/>
    <!-- Central Head Plate -->
    <rect x="28" y="6" width="8" height="18" rx="2" fill="url(#bronze_grad)"/>
    <!-- Top Spike -->
    <polygon points="30,8 32,2 34,8" fill="url(#hammer_metal)"/>
    <!-- Bottom butt cap -->
    <circle cx="32" cy="59" r="3" fill="url(#bronze_grad)"/>
  </g>
  <!-- 2H Badge -->
  <rect x="4" y="4" width="18" height="12" rx="3" fill="#ea580c" fill-opacity="0.9"/>
  <text x="13" y="13" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">2H</text>
</svg>