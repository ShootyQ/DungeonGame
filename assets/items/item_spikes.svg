<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="iron_ball" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="#64748b" fill-opacity="0.1"/>
  <g transform="rotate(45 32 32)">
    <!-- Handle -->
    <rect x="30" y="36" width="4" height="22" rx="1.5" fill="#451a03"/>
    <rect x="29" y="44" width="6" height="10" rx="1" fill="#78350f"/>
    <!-- Chain links -->
    <circle cx="32" cy="32" r="2.5" fill="none" stroke="#64748b" stroke-width="1.8"/>
    <circle cx="32" cy="27" r="2.5" fill="none" stroke="#64748b" stroke-width="1.8"/>
    <circle cx="32" cy="22" r="2.5" fill="none" stroke="#64748b" stroke-width="1.8"/>
    <!-- Spiked Iron Ball -->
    <circle cx="32" cy="14" r="8" fill="url(#iron_ball)"/>
    <!-- Spikes radiating outward -->
    <polygon points="32,6 30,8 34,8" fill="#e2e8f0"/>
    <polygon points="32,22 30,20 34,20" fill="#cbd5e1"/>
    <polygon points="24,14 26,12 26,16" fill="#cbd5e1"/>
    <polygon points="40,14 38,12 38,16" fill="#e2e8f0"/>
    <polygon points="26,8 27,10 29,9" fill="#cbd5e1"/>
    <polygon points="38,8 35,9 37,10" fill="#e2e8f0"/>
    <polygon points="26,20 29,19 27,18" fill="#cbd5e1"/>
    <polygon points="38,20 37,18 35,19" fill="#e2e8f0"/>
  </g>
  <!-- 1H Badge -->
  <rect x="4" y="4" width="18" height="12" rx="3" fill="#0284c7" fill-opacity="0.85"/>
  <text x="13" y="13" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">1H</text>
</svg>