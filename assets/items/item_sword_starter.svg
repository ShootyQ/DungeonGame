<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blade_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <circle cx="32" cy="32" r="28" fill="#38bdf8" fill-opacity="0.1"/>
  <!-- Diagonal 1H Broadsword -->
  <g transform="rotate(45 32 32)">
    <!-- Blade tip and edges -->
    <path d="M30 6 L32 2 L34 6 L35 38 L29 38 Z" fill="url(#blade_grad)"/>
    <!-- Fuller blood groove -->
    <line x1="32" y1="7" x2="32" y2="34" stroke="#334155" stroke-width="1.5"/>
    <!-- Crossguard -->
    <path d="M20 38 H44 C45 38 46 39 45 41 C44 43 43 43 41 42 L35 41 L29 41 L23 42 C21 43 20 43 19 41 C18 39 19 38 20 38 Z" fill="url(#gold_grad)"/>
    <!-- Guard center jewel -->
    <circle cx="32" cy="40" r="2" fill="#ef4444"/>
    <!-- Leather grip -->
    <rect x="30" y="42" width="4" height="12" rx="1" fill="#78350f"/>
    <line x1="30" y1="45" x2="34" y2="44" stroke="#d97706" stroke-width="1"/>
    <line x1="30" y1="48" x2="34" y2="47" stroke="#d97706" stroke-width="1"/>
    <line x1="30" y1="51" x2="34" y2="50" stroke="#d97706" stroke-width="1"/>
    <!-- Pommel -->
    <circle cx="32" cy="56" r="3.5" fill="url(#gold_grad)"/>
    <circle cx="32" cy="56" r="1.5" fill="#ef4444"/>
  </g>
  <!-- 1H Badge -->
  <rect x="4" y="4" width="18" height="12" rx="3" fill="#0284c7" fill-opacity="0.85"/>
  <text x="13" y="13" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">1H</text>
</svg>