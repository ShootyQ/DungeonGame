<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sword_slot_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Diagonal Sword -->
  <g transform="rotate(45 32 32)">
    <!-- Blade -->
    <path d="M30 8 L32 4 L34 8 L34 38 L30 38 Z" fill="url(#sword_slot_grad)"/>
    <line x1="32" y1="5" x2="32" y2="38" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- Guard -->
    <rect x="22" y="38" width="20" height="4" rx="2" fill="#38bdf8" fill-opacity="0.4"/>
    <!-- Grip -->
    <rect x="30" y="42" width="4" height="12" rx="1" fill="#94a3b8" fill-opacity="0.3"/>
    <!-- Pommel -->
    <circle cx="32" cy="56" r="3" fill="#38bdf8" fill-opacity="0.45"/>
  </g>
  <!-- Hand 1 Tag -->
  <text x="32" y="58" font-family="sans-serif" font-size="8" font-weight="bold" fill="#38bdf8" fill-opacity="0.7" text-anchor="middle">MAIN</text>
</svg>