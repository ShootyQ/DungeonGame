  <!-- Buckle straps -->
  <rect x="20" y="26" width="6" height="24" rx="2" fill="#451a03"/>
  <rect x="38" y="26" width="6" height="24" rx="2" fill="#451a03"/>
  <!-- Brass Buckles -->
  <rect x="19" y="34" width="8" height="6" rx="1" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
  <rect x="37" y="34" width="8" height="6" rx="1" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
  <!-- Front pouch -->
  <rect x="22" y="42" width="20" height="12" rx="3" fill="#92400e" stroke="#451a03" stroke-width="1.5"/>
</svg>