<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- Die Face Base -->
    <rect x="3" y="3" width="58" height="58" rx="10" fill="#291807" stroke="#f59e0b" stroke-width="3"/>
    <!-- Inner border glow -->
    <rect x="6" y="6" width="52" height="52" rx="7" fill="none" stroke="#b45309" stroke-width="1.5"/>
    
    <!-- Die Pip indicator in corner -->
    <circle cx="14" cy="14" r="5" fill="#f59e0b"/>
    <text x="14" y="17.5" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" fill="#451a03">5</text>

    <!-- Center Icon -->
    <g transform="translate(16, 12)">
      <polygon points="6,26 10,28 26,12 28,6 22,8" fill="#fbbf24"/>
    <line x1="12" y1="20" x2="24" y2="8" stroke="#451a03" stroke-width="1.5"/>
    </g>

    <!-- Title / Value Banner -->
    <text x="32" y="47" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle" fill="#fbbf24">HEAVY</text>
    <text x="32" y="56" font-family="sans-serif" font-weight="600" font-size="7" text-anchor="middle" fill="#fde68a">6 Damage</text>
  </svg>