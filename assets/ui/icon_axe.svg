<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Executioner's Greataxe Icon -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
  <!-- Shaft -->
  <line x1="16" y1="52" x2="48" y2="12" stroke="#713f12" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Axe Blades (Double bearded battleaxe) -->
  <path d="M 44 16 Q 56 12 52 28 Q 42 26 40 22 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 40 22 Q 28 26 32 12 Q 44 14 42 18 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Bloodied blade edge -->
  <path d="M 52 14 Q 56 20 52 28" stroke="#dc2626" stroke-width="2" fill="none"/>
  <!-- Gold wrapping -->
  <rect x="36" y="22" width="6" height="4" fill="#fbbf24"/>
</svg>